<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E1F00"/>
      <stop offset="100%" stop-color="#74512D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FEBA17"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer decorative border -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>
  
  <!-- Hanger & Dress stylized motif -->
  <path d="M256 120 C242 120 230 131 230 145 C230 159 242 170 256 170 C270 170 282 159 282 145 C282 135 275 127 266 122 L266 95 C266 84 275 75 286 75 C297 75 306 84 306 95" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M140 230 L256 170 L372 230" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Stylized Monogram RK -->
  <text x="256" y="325" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="110" fill="#F8F4E1" text-anchor="middle" letter-spacing="4">RK</text>
  
  <!-- FASHIONS Ribbon -->
  <rect x="110" y="355" width="292" height="42" rx="8" fill="url(#goldGrad)"/>
  <text x="256" y="384" font-family="'Poppins', sans-serif" font-weight="800" font-size="22" fill="#4E1F00" text-anchor="middle" letter-spacing="6">FASHIONS</text>
  
  <!-- Subtitle -->
  <text x="256" y="435" font-family="'Poppins', sans-serif" font-weight="600" font-size="18" fill="#FFE082" text-anchor="middle" letter-spacing="2">LADIES &amp; KIDS WEAR</text>
</svg>
